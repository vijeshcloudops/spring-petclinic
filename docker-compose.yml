# Run with:  docker compose -f compose.app.yml up --build
# (The repo already ships a docker-compose.yml that only starts DBs, so this file uses a different name.)

services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
      MYSQL_DATABASE: petclinic
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  petclinic:
    build: .
    image: spring-petclinic:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/petclinic
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
